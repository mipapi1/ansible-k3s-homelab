---
# https://github.com/longhorn/longhorn/releases
# renovate: datasource=helm depName=longhorn registryUrl=https://charts.longhorn.io
longhorn_chart_version: "1.13.0"
# 2 copies of every volume: survives one node failure, uses a third less disk than 3
longhorn_replica_count: 2
# Rebuild one replica at a time per node (Longhorn default: 5). Each node has a single
# disk shared with etcd; parallel rebuilds after a node outage starved etcd and made
# k3s restart (2026-10-06). Slower recovery, but the control plane stays healthy.
longhorn_concurrent_rebuilds_per_node: 1
# Longhorn reserves each volume's full size on a disk, though volumes are mostly empty
# (disks ~30% used on 2026-10-17, while the reservations had no room left for a new
# replica). 150% lets reservations exceed the disk; real use stays guarded by Longhorn's
# 25% minimum free space and the LonghornNodeStorageLow alert (monitoring role).
longhorn_storage_over_provisioning: 150
# Spread each volume's replicas over the nodes (Longhorn default: disabled). Without it,
# replicas rebuilt after a node outage stay on the nodes that took them: on 2026-10-23 one
# node held 2 of 48 replicas while the other two passed 80% disk use.
longhorn_replica_auto_balance: best-effort
# Delete replica data that no volume uses any more (left behind by failed or moved
# replicas; 22 such directories, ~20 GB, had piled up on one node by 2026-10-23).
# Volumes keep their live replicas and the nightly backups.
longhorn_orphan_auto_deletion: replica-data
# Backups go to the NAS share in nfs_server/nfs_share (Longhorn creates a backupstore/
# folder in the export); empty without nfs_server. Many NAS only offer NFSv3, but
# Longhorn defaults to NFSv4, so force v3.
# `nolock` because Longhorn's containers don't run rpc.statd (NFSv3 locking);
# Longhorn coordinates backups with its own lock files, not NFS locks.
# Backup + restore verified on 2026-10-04.
longhorn_backup_nfs_options: "nfsvers=3,nolock,actimeo=1,soft,timeo=300,retry=2"
longhorn_backup_target: "{{ ('nfs://' ~ nfs_server ~ ':' ~ nfs_share ~ '?nfsOptions=' ~ longhorn_backup_nfs_options) if nfs_server is defined else '' }}"
# Nightly backup of every volume (RecurringJob "backup-nightly", group "default")
longhorn_backup_cron: "30 3 * * *"
longhorn_backup_retain: 7
