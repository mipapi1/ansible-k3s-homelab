---
# https://github.com/external-secrets/external-secrets/releases
# renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
external_secrets_chart_version: "2.12.0"
# Vault as seen from inside the cluster
external_secrets_vault_server: "https://vault.{{ homelab_domain }}"
# KV version 2 secrets engine the ExternalSecrets read from
external_secrets_vault_kv_mount: secret
# Vault side (configured by hand, see the README): auth/kubernetes + the role below, with
# a policy that grants read on secret/data/k8s/*
external_secrets_vault_auth_mount: kubernetes
external_secrets_vault_role: external-secrets
